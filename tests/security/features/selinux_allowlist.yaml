# SELinux AVC denial allowlist
#
# Documents AVC denials that are known-acceptable in Bluefin test environments
# and should not cause the selinux.feature no_denials scenarios to fail.
#
# Format:
#   - scontext: <source context regexp>
#     tcontext: <target context regexp>
#     tclass:   <object class>
#     perm:     <permission(s) — space-separated if multiple>
#     reason:   <why this denial is acceptable>
#     upstream: <upstream bug/issue link, if tracking>
#
# HOW TO USE
# ----------
# When a no_denials scenario fails on CI, capture the offending AVC line from
# `ausearch -m avc --raw`, identify the context triple, and decide:
#
#   ACCEPTABLE (add here): denial is a known kernel/policy gap, not a real
#     security regression, and has an upstream tracking item.
#   NOT ACCEPTABLE (fix the application): denial indicates a mislabeled
#     file, missing file-context rule, or application policy violation.
#
# Keep entries minimal — this list is reviewed on every security PR.

allowlist: []

# Example entry (commented out — add real ones as they are confirmed):
