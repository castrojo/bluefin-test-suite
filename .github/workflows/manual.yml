name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full OCI image reference"
        required: true
        default: "ghcr.io/ublue-os/bluefin:latest"
      suites:
        description: "Comma-separated suites: smoke,developer,dx,software,vanilla-gnome,bazzite,lifecycle"
        required: true
        default: "smoke"

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ github.event.inputs.image }}
      suites: ${{ github.event.inputs.suites }}
