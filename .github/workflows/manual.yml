# Manual test trigger — run supported suites against any bootc image from the
# Actions UI. No self-hosted runners required.
#
# Supported suites: smoke, developer, dx, software, vanilla-gnome, bazzite, common
# Remaining SSH-mode suites (lifecycle, security, hardware) stay on the
# ghost/Argo stack until the broader SSH-mode action work lands.

name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full OCI image reference (e.g. ghcr.io/ublue-os/bluefin:latest)"
        required: true
        default: "ghcr.io/ublue-os/bluefin:latest"
      suites:
        description: "Comma-separated suites: smoke,developer,dx,software,vanilla-gnome,bazzite,common"
        required: true
        default: "smoke"

jobs:
  test:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ${{ github.event.inputs.image }}
      suites: ${{ github.event.inputs.suites }}
