# Manual test trigger — run any suite against any image from the Actions UI.
#
# Prerequisites: same as nightly.yml (self-hosted runner on ghost).
# Usage: Actions → "Run Workflow" → fill in parameters.

name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image reference (e.g. ghcr.io/ublue-os/bluefin:latest)"
        required: true
        default: "ghcr.io/ublue-os/bluefin:latest"
      image_tag:
        description: "Short tag used for golden disk path (e.g. latest, lts, dx-latest)"
        required: true
        default: "latest"
      suite:
        description: "Test suite to run (smoke | developer | lifecycle | security | dx | hardware | vanilla-gnome)"
        required: true
        default: "smoke"
      runner_type:
        description: "Runner type (qecore | plain-ssh)"
        required: false
        default: "qecore"

jobs:
  submit:
    name: Submit ${{ github.event.inputs.suite }} → ${{ github.event.inputs.image_tag }}
    runs-on: [self-hosted, ghost]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Submit Argo workflow
        env:
          BLUEFIN_TEST_PUBKEY: ${{ secrets.BLUEFIN_TEST_PUBKEY }}
        run: |
          argo submit argo/bluefin-smoke-test.yaml \
            -p image="${{ github.event.inputs.image }}" \
            -p image-tag="${{ github.event.inputs.image_tag }}" \
            -p suite="${{ github.event.inputs.suite }}" \
            -p runner-type="${{ github.event.inputs.runner_type }}" \
            -p ssh-pubkey="${BLUEFIN_TEST_PUBKEY}" \
            -p pr-title="manual:${{ github.actor }}" \
            -p pr-number="" \
            -n argo \
            --wait \
            --log

      - name: Show results location
        run: |
          echo "Results persisted on ghost at:"
          echo "  /var/tmp/bluefin-results/<workflow-uid>/${{ github.event.inputs.suite }}/"
          echo ""
          echo "To browse: ssh ghost 'ls -lt /var/tmp/bluefin-results/ | head -5'"
