# Manual test trigger — run any GUI suite against any bootc image from the
# Actions UI. No self-hosted runners required.
#
# Supported suites: smoke, developer, dx, software, vanilla-gnome, bazzite
# SSH-mode suites (lifecycle, security, hardware) are not yet in the GHA
# action — tracked in epics #43 and #44.

name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full OCI image reference (e.g. ghcr.io/ublue-os/bluefin:latest)"
        required: true
        default: "ghcr.io/ublue-os/bluefin:latest"
      suites:
        description: "Comma-separated suites: smoke,developer,dx,software,vanilla-gnome,bazzite"
        required: true
        default: "smoke"

jobs:
  test:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@10209e10f334b7ae186fa6b4357b8f7e575f8368 # main
    with:
      image: ${{ github.event.inputs.image }}
      suites: ${{ github.event.inputs.suites }}
