# Build and publish the KDE/Plasma e2e test runner container image.
#
# Image: ghcr.io/projectbluefin/testsuite-kde-runner:kde-runner
#
# This image carries host-side orchestration dependencies only (behave,
# selenium, websocket-client, lxml, PyYAML, odiff).  The native input
# synthesizer for KWin is NOT included here; it must be installed on the
# device-under-test to match the DUT's Plasma/Qt ABI.
#
# Triggered when:
#   - container/Containerfile.kde-runner or its requirements change
#   - Weekly on Monday (keeps base OS + pip packages fresh)
#   - Manual dispatch

name: Build KDE runner image

on:
  push:
    branches: [main]
    paths:
      - container/Containerfile.kde-runner
      - container/requirements.kde-runner.txt
      - .github/workflows/build-kde-runner.yml
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC — keep base + pip deps fresh
  workflow_dispatch:

jobs:
  build:
    name: Build and push testsuite-kde-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: container/Containerfile.kde-runner
          push: true
          tags: |
            ghcr.io/projectbluefin/testsuite-kde-runner:kde-runner
            ghcr.io/projectbluefin/testsuite-kde-runner:kde-runner-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ghcr.io/projectbluefin/testsuite-kde-runner:kde-runner @ ${{ steps.build.outputs.digest }}"
