# Build and publish the e2e test runner container image.
#
# Image: ghcr.io/projectbluefin/testsuite:runner
#
# Triggered when:
#   - container/Containerfile.runner changes (new deps)
#   - Weekly on Monday (keeps base OS + pip packages fresh)
#   - Manual dispatch
#
# Consumers: .github/workflows/e2e.yml pulls this image on the ubuntu runner
# and pipes it into the QEMU VM to skip slow in-VM pip installs.

name: Build test runner image

on:
  push:
    branches: [main]
    paths:
      - container/Containerfile.runner
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC — keep base + pip deps fresh
  workflow_dispatch:

jobs:
  build:
    name: Build and push testsuite:runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: container/Containerfile.runner
          push: true
          tags: |
            ghcr.io/projectbluefin/testsuite:runner
            ghcr.io/projectbluefin/testsuite:runner-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ghcr.io/projectbluefin/testsuite:runner @ ${{ steps.build.outputs.digest }}"
