# Build and publish the e2e test runner container image.
#
# Image: ghcr.io/projectbluefin/testsuite:runner
#
# Triggered when:
#   - container/Containerfile.runner changes (new deps)
#   - Weekly on Monday (keeps base OS + pip packages fresh)
#   - Manual dispatch
#
# Consumers: .github/workflows/e2e.yml pulls this image on the ubuntu runner
# and pipes it into the QEMU VM to skip slow in-VM pip installs.

name: Build test runner image

on:
  push:
    branches: [main]
    paths:
      - container/Containerfile.runner
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC — keep base + pip deps fresh
  workflow_dispatch:

jobs:
  build:
    name: Build and push testsuite:runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730b70b8d9dc2283a96c7a600c16c81e7b8b2e # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: container/Containerfile.runner
          push: true
          tags: |
            ghcr.io/projectbluefin/testsuite:runner
            ghcr.io/projectbluefin/testsuite:runner-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ghcr.io/projectbluefin/testsuite:runner @ ${{ steps.build.outputs.digest }}"
