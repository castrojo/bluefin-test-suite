# Build and publish the e2e test runner container image.
#
# Image: ghcr.io/projectbluefin/testsuite:runner
#
# Triggered when:
#   - container/Containerfile.runner changes (new deps)
#   - Weekly on Monday (keeps base OS + pip packages fresh)
#   - Manual dispatch
#
# Consumers: .github/workflows/e2e.yml pulls this image on the ubuntu runner
# and pipes it into the QEMU VM to skip slow in-VM pip installs.

name: Build test runner image

on:
  push:
    branches: [main]
    paths:
      - container/Containerfile.runner
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 03:00 UTC — keep base + pip deps fresh
  workflow_dispatch:

jobs:
  build:
    name: Build and push testsuite:runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: container/Containerfile.runner
          push: true
          tags: |
            ghcr.io/projectbluefin/testsuite:runner
            ghcr.io/projectbluefin/testsuite:runner-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ghcr.io/projectbluefin/testsuite:runner @ ${{ steps.build.outputs.digest }}"
