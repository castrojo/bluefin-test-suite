# PR Validation — lint & syntax checks
#
# Runs on every PR and push to main.  All checks are lightweight and run
# on ubuntu-latest.
#
# Checks:
#   1. Python lint      — ruff (import errors, undefined names, style)
#   2. Python syntax    — py_compile on every .py file in tests/
#   3. Behave dry-run   — validates step definitions + feature file syntax
#                         without booting a VM (catches undefined steps,
#                         broken imports, mismatched step patterns)
#   4. YAML lint        — yamllint in relaxed mode on argo/
#   5. Argo YAML parse  — yaml.safe_load on every argo/*.yaml

name: PR Validation — lint & syntax checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AT-SPI GObject bindings for behave dry-run
        # qecore.sandbox imports isA11yEnabled from dogtail.utils at module level.
        # dogtail.utils requires gi.repository.Gtk + gi.repository.Atspi.
        # python3-gi is a compiled C extension — it must run under the SAME Python
        # binary it was compiled for.  On ubuntu-24.04 that is the system python3;
        # the toolcache Python would SIGTRAP on ABI mismatch even at the same minor
        # version.  The behave dry-run step therefore uses 'python3' (system) not
        # 'python' (toolcache), with behave/qecore/dogtail installed via pip3.
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-atspi-2.0 \
            gir1.2-gtk-3.0
          pip3 install --break-system-packages --quiet behave qecore dogtail

      - name: Install linting tools
        run: pip install ruff yamllint

      - name: Python lint (ruff)
        run: ruff check tests/ --select E,F,W --ignore E501

      - name: Python syntax check
        run: |
          python -m py_compile $(find tests/ -name '*.py' | tr '\n' ' ')
          echo "All Python files compile cleanly."

      - name: Behave dry-run (step definition coverage)
        # Validates that every step in every feature file has a matching
        # @step definition.  Does NOT boot a VM — exits 1 if any step is
        # undefined, which catches broken imports and missing step patterns.
        # Uses system python3 so that the pre-compiled python3-gi bindings
        # (installed above) are ABI-compatible with the interpreter.
        run: |
          FAIL=0
          for suite in tests/*/features/; do
            # Skip suites with no .feature files (empty scaffolds in-progress)
            if ! ls "${suite}"*.feature >/dev/null 2>&1; then
              echo "Skipping ${suite} — no .feature files yet"
              continue
            fi
            suitename=$(echo "$suite" | cut -d/ -f2)
            echo "::group::behave --dry-run $suitename"
            PYTHONPATH="${{ github.workspace }}" \
              python3 -m behave "$suite" --dry-run --no-capture || FAIL=1
            echo "::endgroup::"
          done
          [ "$FAIL" -eq 0 ] && echo "All suites: every step is defined." || \
            { echo "One or more suites have undefined steps."; exit 1; }

      - name: YAML lint (argo/)
        run: yamllint -d relaxed argo/

      - name: Argo YAML parse check
        run: |
          for f in argo/*.yaml; do
            echo "Checking $f …"
            python -c "import yaml, sys; yaml.safe_load(open('$f')) or sys.exit(0)"
          done
          echo "All Argo YAML files parse cleanly."
