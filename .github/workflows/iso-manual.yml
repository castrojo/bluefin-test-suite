name: Manual ISO Validation

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "HTTPS URL for the ISO to validate"
        required: true
        type: string
      iso_ref:
        description: "Immutable projectbluefin/iso ref containing the harness"
        required: true
        type: string
      variant:
        description: "ISO variant"
        required: false
        default: ""
        type: string
      run_e2e:
        description: "Run unattended installation and post-install boot validation"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/iso-validation.yml
    with:
      iso_url: ${{ inputs.iso_url }}
      iso_ref: ${{ inputs.iso_ref }}
      variant: ${{ inputs.variant }}
      run_e2e: ${{ inputs.run_e2e }}
