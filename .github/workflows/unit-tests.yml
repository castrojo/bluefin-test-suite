# Unit Tests — pytest + coverage
#
# Runs on every PR and push to main. Lightweight — no ghost runner needed.
# Enforces 80% coverage threshold on Python helper/utility code that can
# be tested without a live VM or cluster.

name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=tests/shared --cov=tests/smoke/features/environment.py --cov-report=term --cov-fail-under=80

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
