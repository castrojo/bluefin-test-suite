# Unit Tests — pytest
#
# Runs on every PR and push to main. Lightweight — no ghost runner needed.
# Validates syntax, structure, and logic of Python helpers that can be
# tested without a live VM or cluster.

name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/unit/ -v
