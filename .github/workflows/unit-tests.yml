# Unit Tests — pytest
#
# Runs on every PR and push to main. Lightweight — no VM or cluster needed.
# Validates syntax, structure, and logic of Python helpers that can be
# tested without a live VM.

name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: pytest tests/unit/ -v
