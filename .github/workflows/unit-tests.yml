# Unit Tests — pytest
#
# Runs on every PR and push to main. Lightweight — no VM or cluster needed.
# Validates syntax, structure, and logic of Python helpers that can be
# tested without a live VM.

name: Unit Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install pytest pytest-cov behave

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=tests --cov-report=xml --cov-report=term-missing --cov-fail-under=65

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
