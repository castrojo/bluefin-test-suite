# Unit Tests — pytest
#
# Runs on every PR and push to main. Lightweight — no VM or cluster needed.
# Validates syntax, structure, and logic of Python helpers that can be
# tested without a live VM.

name: Unit Tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: pip install coverage pytest pytest-xdist behave

      - name: Run unit tests
        env:
          COVERAGE_PROCESS_START: .coveragerc
        run: |
          coverage erase
          coverage run -m pytest -n auto tests/unit/ -v
          coverage combine
          coverage xml
          coverage report --fail-under=75

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
