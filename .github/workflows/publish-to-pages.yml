name: Publish screenshots to gh-pages

# Runs on a schedule to pull slug-specific screenshot tags from GHCR and publish
# them to gh-pages as stable HTTP URLs. Also triggered manually for immediate publish.
#
# Why schedule instead of workflow_run:
#   e2e.yml is workflow_call-only; runs created by consumer repos (bluefin, dakota, lts)
#   do not appear in testsuite's own run list, so workflow_run would never fire.
#   The schedule polls every 2 hours, after all consumer nightly/testing e2e runs complete.
#
# Why slug-specific GHCR tags:
#   e2e.yml pushes ghcr.io/projectbluefin/testsuite/desktop-screenshot:<slug>-<suite>-latest
#   where slug = strip(ghcr.io/<org>/) + replace(:,-) from inputs.image.
#   Example: ghcr.io/projectbluefin/bluefin:testing → bluefin-testing
#   This allows publish-to-pages to pull per-image screenshots without cross-repo auth.

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours; covers nightly (02:00 UTC) and post-merge runs
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Install oras
        run: |
          ORAS_VERSION="1.2.3"
          curl -sSfL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar xz oras
          sudo mv oras /usr/local/bin/oras

      - name: Pull screenshots and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p screenshots scratch

          REGISTRY="ghcr.io/projectbluefin/testsuite/desktop-screenshot"

          # Known image slugs — add new images here when the fleet grows.
          # Slug derivation: strip ghcr.io/<org>/ from image ref, replace : with -
          # e.g. ghcr.io/projectbluefin/bluefin:testing → bluefin-testing
          SLUGS=(
            bluefin-testing
            bluefin-lts-testing
            dakota-testing
          )
          SUITES=(smoke common vanilla-gnome)
          DATE=$(date +%Y%m%d)
          UPDATED=0

          for SLUG in "${SLUGS[@]}"; do
            for SUITE in "${SUITES[@]}"; do
              TAG="${SLUG}-${SUITE}-latest"
              SHOT_DIR="scratch/${SLUG}/${SUITE}"
              mkdir -p "$SHOT_DIR"

              if oras pull "${REGISTRY}:${TAG}" -o "$SHOT_DIR/" 2>/dev/null; then
                SHOT=$(find "$SHOT_DIR/" -name "*.png" | head -1)
                if [[ -n "$SHOT" ]]; then
                  cp "$SHOT" "screenshots/${TAG}.png"
                  echo "Published screenshots/${TAG}.png"
                  UPDATED=$((UPDATED + 1))

                  # Read annotations for JSONL — run_id and caller_repo
                  MANIFEST=$(oras manifest fetch "${REGISTRY}:${TAG}" 2>/dev/null || echo "{}")
                  RUN_ID=$(echo "$MANIFEST" | jq -r '.annotations["io.github.projectbluefin.run_id"] // ""')
                  CALLER=$(echo "$MANIFEST" | jq -r '.annotations["io.github.projectbluefin.caller_repo"] // ""')

                  mkdir -p data
                  printf '{"date":"%s","run_id":"%s","caller_repo":"%s","slug":"%s","suite":"%s","result":"success"}\n' \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_ID" "$CALLER" "$SLUG" "$SUITE" \
                    >> "data/results-${DATE}.jsonl"
                fi
              fi
            done
          done

          echo "Published ${UPDATED} screenshots"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/ data/
          git diff --cached --quiet || git commit -m "chore: update screenshots [skip ci]"
          git push
