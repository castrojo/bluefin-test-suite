name: issue and PR lifecycle

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  schedule:
    - cron: '0 9 * * *'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  lifecycle:
    uses: projectbluefin/actions/.github/workflows/lifecycle.yml@c4e9e5511a984cc88623be152e140d96740185f5 # main
    with:
      brand_name: "Testsuite"
    secrets: inherit
