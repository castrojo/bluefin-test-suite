# Nightly test matrix — runs GUI suites against bluefin:latest and bluefin:lts
# on standard ubuntu-latest runners via the projectbluefin/testsuite GHA.
#
# No self-hosted runners. No secrets required.
#
# SSH-mode suites (lifecycle, security, hardware) are not yet in the GHA
# action and are tracked in epics #43 and #44.

name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image stream to test (latest | lts | both)"
        required: false
        default: "both"
      suites:
        description: "Comma-separated suites (default: smoke,developer,software,vanilla-gnome,common)"
        required: false
        default: "smoke,developer,software,vanilla-gnome,common"

jobs:
  test-latest:
    if: ${{ github.event.inputs.image_tag != 'lts' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:latest
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,vanilla-gnome,common' }}

  test-lts:
    if: ${{ github.event.inputs.image_tag != 'latest' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:lts
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,vanilla-gnome,common' }}

  test-dx:
    if: ${{ github.event.inputs.image_tag != 'lts' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-dx:latest
      suites: dx
