# Nightly test matrix — runs GUI suites against all Bluefin image variants,
# bazzite-gnome:latest, and the upstream GNOME OS bootc image.
#
# Bluefin variants:  bluefin (latest/lts/gts)  bluefin-dx (latest/lts/gts)  bluefin-nvidia
# Bazzite:          bazzite-gnome:latest  (bazzite suite only)
# GNOME OS:         gnomeos-latest        (vanilla-gnome baseline)
#
# No self-hosted runners. No secrets required.
#
# SSH-mode suites (lifecycle, security, hardware) are not yet in the GHA
# action and are tracked in epics #43 and #44.

name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites to override for Bluefin jobs (default: smoke,developer,software,common)"
        required: false
        default: "smoke,developer,software,common"

permissions:
  contents: read
  packages: write

jobs:
  # ── bluefin ──────────────────────────────────────────────────────────────────

  test-latest:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:latest
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,common' }}
    permissions:
      contents: read
      packages: write

  test-gts:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:gts
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,common' }}
    permissions:
      contents: read
      packages: write

  test-lts:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:lts
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,common' }}
    permissions:
      contents: read
      packages: write

  # ── bluefin-dx ───────────────────────────────────────────────────────────────

  test-dx:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-dx:latest
      suites: smoke,developer,dx,common
    permissions:
      contents: read
      packages: write

  test-dx-gts:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-dx:gts
      suites: smoke,developer,dx,common
    permissions:
      contents: read
      packages: write

  test-dx-lts:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-dx:lts
      suites: smoke,developer,dx,common
    permissions:
      contents: read
      packages: write

  # ── bluefin-nvidia ───────────────────────────────────────────────────────────

  test-nvidia:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-nvidia:latest
      suites: smoke,common
    permissions:
      contents: read
      packages: write

  # ── bazzite ──────────────────────────────────────────────────────────────────

  test-bazzite:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bazzite-gnome:latest
      suites: bazzite
    permissions:
      contents: read
      packages: write

  # ── upstream GNOME OS (vanilla-gnome baseline) ───────────────────────────────

  test-gnomeos:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: quay.io/gnome_infrastructure/gnome-build-meta:gnomeos-latest
      suites: vanilla-gnome
    permissions:
      contents: read
      packages: write
