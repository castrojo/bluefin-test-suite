# Nightly test matrix — runs GUI suites against bluefin:latest, bluefin:lts,
# bazzite-gnome:latest, and the upstream GNOME OS bootc image.
#
# No self-hosted runners. No secrets required.
#
# SSH-mode suites (lifecycle, security, hardware) are not yet in the GHA
# action and are tracked in epics #43 and #44.

name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image stream to test (latest | lts | bazzite | gnomeos | both)"
        required: false
        default: "both"
      suites:
        description: "Comma-separated suites (default: smoke,developer,software,common)"
        required: false
        default: "smoke,developer,software,common"

permissions:
  contents: read
  packages: write

jobs:
  test-latest:
    if: ${{ github.event.inputs.image_tag != 'lts' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:latest
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,common' }}
    permissions:
      contents: read
      packages: write

  test-lts:
    if: ${{ github.event.inputs.image_tag != 'latest' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin:lts
      suites: ${{ github.event.inputs.suites || 'smoke,developer,software,common' }}
    permissions:
      contents: read
      packages: write

  test-bazzite:
    if: ${{ github.event.inputs.image_tag != 'lts' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bazzite-gnome:latest
      suites: bazzite
    permissions:
      contents: read
      packages: write

  test-dx:
    if: ${{ github.event.inputs.image_tag != 'lts' }}
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: ghcr.io/ublue-os/bluefin-dx:latest
      suites: dx
    permissions:
      contents: read
      packages: write

  test-gnomeos:
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@main
    with:
      image: quay.io/gnome_infrastructure/gnome-build-meta:gnomeos-latest
      suites: vanilla-gnome
    permissions:
      contents: read
      packages: write
