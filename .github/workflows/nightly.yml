# Nightly test matrix — runs GUI suites against all Bluefin image variants,
# bazzite-gnome, and the upstream GNOME OS bootc image.
#
# Each image is tested on both its *testing* (pre-release) and *stable/lts*
# tracks so regressions are caught before promotion.
#
# Images at ghcr.io/projectbluefin/:
#   bluefin              testing / stable / lts-testing / lts  → smoke,developer,common
#   bluefin-nvidia-open  testing / stable                      → smoke,common
#   dakota               testing / latest                      → smoke,common
# Images at ghcr.io/ublue-os/:
#   bluefin-gdx          stream10-testing / stream10 (=lts)    → smoke,developer,dx,common
#   bazzite-gnome        testing / stable                      → bazzite
# GNOME OS (quay.io):
#   gnomeos-latest                                             → vanilla-gnome,software
#
# No self-hosted runners. No secrets required.
#
# SSH-mode suites (lifecycle, security, hardware) are not yet in the GHA
# action and are tracked in epics #43 and #44.

name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites to override for Bluefin jobs (default: smoke,developer,common)"
        required: false
        default: "smoke,developer,common"
      skip_native_apps:
        description: "Skip @native_app scenarios (non-Flatpak app tests: Calculator, Files, Settings, etc.)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # ── bluefin (projectbluefin) ─────────────────────────────────────────────────

  test-testing:
    name: bluefin:testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin:testing
      suites: ${{ github.event.inputs.suites || 'smoke,developer,common' }}
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-stable:
    name: bluefin:stable
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin:stable
      suites: ${{ github.event.inputs.suites || 'smoke,developer,common' }}
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-lts-testing:
    name: bluefin:lts-testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin:lts-testing
      suites: ${{ github.event.inputs.suites || 'smoke,developer,common' }}
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-lts:
    name: bluefin:lts
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin:lts
      suites: ${{ github.event.inputs.suites || 'smoke,developer,common' }}
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── bluefin-gdx (ublue-os) ───────────────────────────────────────────────────

  test-gdx-testing:
    name: bluefin-gdx:stream10-testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/ublue-os/bluefin-gdx:stream10-testing
      suites: smoke,developer,dx,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-gdx-lts:
    name: bluefin-gdx:stream10
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/ublue-os/bluefin-gdx:stream10
      suites: smoke,developer,dx,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── bluefin-nvidia-open (projectbluefin) ─────────────────────────────────────

  test-nvidia-testing:
    name: bluefin-nvidia-open:testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin-nvidia-open:testing
      suites: smoke,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-nvidia-stable:
    name: bluefin-nvidia-open:stable
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/bluefin-nvidia-open:stable
      suites: smoke,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── dakota (projectbluefin) ──────────────────────────────────────────────────

  test-dakota-testing:
    name: dakota:testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/dakota:testing
      suites: smoke,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-dakota:
    name: dakota:latest
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/projectbluefin/dakota:latest
      suites: smoke,common
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── bazzite (ublue-os) ───────────────────────────────────────────────────────

  test-bazzite-testing:
    name: bazzite-gnome:testing
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/ublue-os/bazzite-gnome:testing
      suites: bazzite
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  test-bazzite:
    name: bazzite-gnome:stable
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: ghcr.io/ublue-os/bazzite-gnome:stable
      suites: bazzite
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── upstream GNOME OS (vanilla-gnome baseline) ───────────────────────────────

  test-gnomeos:
    name: gnomeos-latest (vanilla-gnome)
    uses: projectbluefin/testsuite/.github/workflows/e2e.yml@7204c515560a598e983cc05a2b645bb6a2a2da6b # main
    with:
      image: quay.io/gnome_infrastructure/gnome-build-meta:gnomeos-latest
      suites: vanilla-gnome,software
      skip_native_apps: ${{ github.event.inputs.skip_native_apps == 'true' }}
    permissions:
      contents: read
      packages: write

  # ── bluefin lifecycle — ublue-os → projectbluefin migration, zstd:chunked ────

  test-bluefin-lifecycle:
    name: bluefin:lifecycle (ublue-os→projectbluefin, zstd:chunked)
    uses: projectbluefin/actions/.github/workflows/upgrade-test.yml@b6f0e6c968038984652b4594f5d182a80de2b8e2 # main
    with:
      image: ghcr.io/ublue-os/bluefin:latest
      suites: lifecycle
      chunked_enabled: true
    permissions:
      contents: read
      packages: write

  persist-results:
    name: persist-results
    needs:
      - test-testing
      - test-stable
      - test-lts-testing
      - test-lts
      - test-gdx-testing
      - test-gdx-lts
      - test-nvidia-testing
      - test-nvidia-stable
      - test-dakota-testing
      - test-dakota
      - test-bazzite-testing
      - test-bazzite
      - test-gnomeos
      - test-bluefin-lifecycle
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout testsuite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download result artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-results-*
          path: downloaded-results

      - name: Build nightly JSONL bundle
        id: bundle
        run: |
          set -euo pipefail
          RUN_DATE="$(date -u +%F)"
          OUTPUT_DIR="persisted-results"
          OUTPUT_FILE="${OUTPUT_DIR}/results-${RUN_DATE}.jsonl"
          mkdir -p "${OUTPUT_DIR}"
          : > "${OUTPUT_FILE}"
          shopt -s globstar nullglob

          found_metadata=0
          for metadata in downloaded-results/**/artifact-metadata.json; do
            found_metadata=1
            artifact_dir="$(dirname "${metadata}")"
            image="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["image"])' "${metadata}")"
            suite="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["suite"])' "${metadata}")"
            if [[ -f "${artifact_dir}/results.json" ]]; then
              python3 scripts/parse_results.py "${artifact_dir}/results.json" \
                --image "${image}" \
                --suite "${suite}" \
                --date "${RUN_DATE}" >> "${OUTPUT_FILE}"
            else
              echo "::notice::Skipping ${image} / ${suite}: results.json missing"
            fi
          done

          if [[ "${found_metadata}" -eq 0 ]]; then
            echo "::warning::No result artifacts were downloaded"
          fi

          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "output_file=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish gh-pages data
        env:
          OUTPUT_FILE: ${{ steps.bundle.outputs.output_file }}
          RUN_DATE: ${{ steps.bundle.outputs.run_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-worktree origin/gh-pages
            cd gh-pages-worktree
            git checkout -B gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages-worktree HEAD
            cd gh-pages-worktree
            git checkout --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          mkdir -p data
          cp "../${OUTPUT_FILE}" "data/results-${RUN_DATE}.jsonl"
          git add "data/results-${RUN_DATE}.jsonl"

          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit"
          else
            git commit -m "chore(ci): persist nightly results for ${RUN_DATE}"
            git push origin gh-pages
          fi

          cd ..
          git worktree remove --force gh-pages-worktree
