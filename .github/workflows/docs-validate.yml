name: Docs validate

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f392ef58e # v5.0.0
        with:
          python-version: "3.14"

      - name: Install check dependencies
        run: pip install pyyaml

      - name: Validate docs
        run: python3 scripts/validate_docs.py
