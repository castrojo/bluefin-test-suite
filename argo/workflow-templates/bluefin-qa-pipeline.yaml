apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bluefin-qa-pipeline
  namespace: argo
  labels:
    app.kubernetes.io/component: qa-pipeline
    app.kubernetes.io/part-of: bluefin-test-suite
spec:
  # ── entrypoint ──────────────────────────────────────────────────────────────
  entrypoint: pipeline

  # ── cleanup VM + hostDisk on any exit (success, failure, timeout) ──────────
  onExit: teardown

  # ── parameters ──────────────────────────────────────────────────────────────
  arguments:
    parameters:
      - name: image
        value: "ghcr.io/ublue-os/bluefin:latest"
      - name: image-tag
        value: "latest"
      - name: namespace
        value: "bluefin-test"
      # Comma-separated suite phases to run in order.
      - name: phases
        value: "/smoke,/developer-tools"
      - name: runner-type
        value: "qecore"
      - name: ssh-pubkey
        value: ""
      - name: ssh-key-secret
        value: "bluefin-test-ssh-key"

  # ── pipeline DAG ─────────────────────────────────────────────────────────────
  templates:
    - name: pipeline
      dag:
        tasks:
          # 1. Ensure the golden disk exists on ghost (BIB build if absent)
          - name: ensure-disk
            templateRef:
              name: bib-build-and-push
              template: ensure-disk
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: ssh-pubkey
                  value: "{{workflow.parameters.ssh-pubkey}}"

          # 2. btrfs reflink clone + KubeVirt VM boot → vm-ip
          - name: provision
            dependencies: [ensure-disk]
            templateRef:
              name: provision-variant-vm
              template: provision-variant-vm
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: vm-name
                  value: "bluefin-test-{{workflow.uid}}"
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"

          # 3a. Phase 1 — smoke (/smoke plan must be in phases list)
          - name: run-smoke
            dependencies: [provision]
            when: "'{{workflow.parameters.phases}}' contains '/smoke'"
            templateRef:
              name: run-variant-tests
              template: run-variant-tests
            arguments:
              parameters:
                - name: vm-ip
                  value: "{{tasks.provision.outputs.parameters.vm-ip}}"
                - name: suite
                  value: "smoke"
                - name: variant
                  value: "{{workflow.parameters.image-tag}}"
                - name: runner-type
                  value: "{{workflow.parameters.runner-type}}"

          # 3b. Phase 2 — developer tools (sequential after smoke)
          - name: run-developer-tools
            dependencies: [run-smoke]
            when: "'{{workflow.parameters.phases}}' contains '/developer-tools'"
            templateRef:
              name: run-variant-tests
              template: run-variant-tests
            arguments:
              parameters:
                - name: vm-ip
                  value: "{{tasks.provision.outputs.parameters.vm-ip}}"
                - name: suite
                  value: "developer"
                - name: variant
                  value: "{{workflow.parameters.image-tag}}"
                - name: runner-type
                  value: "{{workflow.parameters.runner-type}}"

          # 3c. Phase 3 — software management (sequential, only if in phases list)
          - name: run-software-management
            dependencies: [run-developer-tools]
            when: "'{{workflow.parameters.phases}}' contains '/software-management'"
            templateRef:
              name: run-variant-tests
              template: run-variant-tests
            arguments:
              parameters:
                - name: vm-ip
                  value: "{{tasks.provision.outputs.parameters.vm-ip}}"
                - name: suite
                  value: "software"
                - name: variant
                  value: "{{workflow.parameters.image-tag}}"
                - name: runner-type
                  value: "{{workflow.parameters.runner-type}}"

    # ── onExit handler: stop VM → wait VMI gone → delete hostDisk ──────────────
    - name: teardown
      dag:
        tasks:
          - name: teardown-vm
            templateRef:
              name: teardown-bluefin-vm
              template: teardown-vm
            arguments:
              parameters:
                - name: vm-name
                  value: "bluefin-test-{{workflow.uid}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"
