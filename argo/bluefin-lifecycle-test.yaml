apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: bluefin-lifecycle-
  namespace: argo
spec:
  entrypoint: lifecycle-pipeline
  serviceAccountName: argo
  podMetadata:
    labels:
      app.kubernetes.io/part-of: bluefin-test-suite
      bluefin.io/suite: lifecycle
      bluefin.io/variant: "{{workflow.parameters.image-tag}}"
    annotations:
      bluefin.io/image-tag: "{{workflow.parameters.image-tag}}"
      bluefin.io/pr-title: "{{workflow.parameters.pr-title}}"
  onExit: cleanup

  arguments:
    parameters:
      - name: image
        value: "ghcr.io/ublue-os/bluefin:latest"
      - name: image-tag
        value: "latest"
      - name: ssh-pubkey
        value: ""
      - name: namespace
        value: "bluefin-test"
      # upgrade-target: image reference to upgrade TO (must be a valid bootc image).
      # Default points at the same tag — tests bootc re-pull / no-op upgrade path.
      # Override to test cross-channel switch, e.g. ghcr.io/ublue-os/bluefin:gts
      - name: upgrade-target
        value: ""
      - name: pr-title
        value: ""
      - name: pr-number
        value: ""

  templates:
    - name: lifecycle-pipeline
      dag:
        tasks:
          - name: ensure-disk
            templateRef:
              name: bib-build-and-push
              template: ensure-disk
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: ssh-pubkey
                  value: "{{workflow.parameters.ssh-pubkey}}"

          - name: provision
            dependencies: [ensure-disk]
            templateRef:
              name: provision-variant-vm
              template: provision-variant-vm
            arguments:
              parameters:
                - name: image
                  value: "{{workflow.parameters.image}}"
                - name: image-tag
                  value: "{{workflow.parameters.image-tag}}"
                - name: vm-name
                  value: "bluefin-lifecycle-{{workflow.uid}}"
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"

          # Smoke first: baseline must pass before lifecycle mutations
          - name: run-smoke
            dependencies: [provision]
            templateRef:
              name: run-variant-tests
              template: run-variant-tests
            arguments:
              parameters:
                - name: vm-ip
                  value: "{{tasks.provision.outputs.parameters.vm-ip}}"
                - name: suite
                  value: "smoke"
                - name: runner-type
                  value: "qecore"
                - name: variant
                  value: "{{workflow.parameters.image-tag}}"

          # Lifecycle tests: bootc upgrade → reboot → verify new deployment → rollback.
          # runner-type=plain-ssh: the step definitions handle SSH reconnect after reboot
          # by polling the VM IP until sshd answers again (see lifecycle/steps.py).
          # activeDeadlineSeconds on run-variant-tests (3600) accommodates:
          #   - bootc pull (~3 min on warm cache)
          #   - reboot + GNOME ready (~4 min)
          #   - verification SSH session
          - name: run-lifecycle
            dependencies: [run-smoke]
            templateRef:
              name: run-variant-tests
              template: run-variant-tests
            arguments:
              parameters:
                - name: vm-ip
                  value: "{{tasks.provision.outputs.parameters.vm-ip}}"
                - name: suite
                  value: "lifecycle"
                - name: runner-type
                  value: "plain-ssh"
                - name: variant
                  value: "{{workflow.parameters.image-tag}}"
                - name: behave-tags
                  value: "@lifecycle"

    - name: cleanup
      steps:
        - - name: delete-vm
            templateRef:
              name: teardown-bluefin-vm
              template: teardown-vm
            arguments:
              parameters:
                - name: vm-name
                  value: "bluefin-lifecycle-{{workflow.uid}}"
                - name: namespace
                  value: "{{workflow.parameters.namespace}}"
